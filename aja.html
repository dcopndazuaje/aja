<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficas</title>

    <!-- Librería Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .contenedor {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

    <h1>📊 Mis Gráficas</h1>

    <div class="contenedor">
        <h2>Gráfica de ventas</h2>
        <canvas id="graficaBarras"></canvas>
    </div>

    <div class="contenedor">
        <h2>Gráfica de temperatura</h2>
        <canvas id="graficaLinea"></canvas>
    </div>

    <script>
      
        const graficaBarras = document.getElementById("graficaBarras");

        new Chart(graficaBarras, {
            type: "bar",
            data: {
                labels: ["Enero", "Febrero", "Marzo", "Abril", "Mayo"],
                datasets: [{
                    label: "Ventas",
                    data: [120, 190, 150, 220, 280],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });


        const graficaLinea = document.getElementById("graficaLinea");

        new Chart(graficaLinea, {
            type: "line",
            data: {
                labels: ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"],
                datasets: [{
                    label: "Temperatura °C",
                    data: [20, 22, 21, 25, 24],
                    borderWidth: 3,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true
            }
        });
    </script>

</body>
</html>
